services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DEMO_MODE: "true"
      DATABASE_URL: sqlite:////data/scam_shield.db
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173,http://localhost:4173
      JWT_SECRET: docker-dev-secret-change-me
      EMAIL_BACKEND: console
    volumes:
      - backend-data:/data
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:8000
    depends_on:
      - backend

volumes:
  backend-data:
